name: release
# Publishes to npm and ClawHub from CI. No token ever touches a developer
# machine: NPM_TOKEN and CLAWHUB_TOKEN are repository secrets.
#
# Run with dry_run=true first (default): validates the package, previews the
# ClawHub publishes, needs no secrets. Then run with dry_run=false.
#
# Both registries use OIDC trusted publishing: no token anywhere.
#   npm:     npmjs.com → package clawphylax → Settings → Trusted publishing → GitHub Actions
#            (Organization or user: aeneassoft, Repository: clawphylax, Workflow filename: release.yml)
#   ClawHub: clawhub package trusted-publisher set clawphylax --repository aeneassoft/clawphylax --workflow-filename release.yml
# Trigger: GitHub → Actions → release → Run workflow → dry_run=false.
# The CLAWHUB_TOKEN / NPM_TOKEN secrets are optional fallbacks and should stay unset.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no publish)"
        type: boolean
        default: true
      publish_npm:
        description: "Publish to npm"
        type: boolean
        default: true
      publish_clawhub:
        description: "Publish the plugin to ClawHub"
        type: boolean
        default: true
      publish_skills:
        description: "Also republish every skill under skill/ to ClawHub"
        type: boolean
        default: false
      changelog:
        description: "Release note shown on ClawHub"
        type: string
        default: "See CHANGELOG.md for this version."

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: npx vitest run
      - run: npm pack --dry-run

  npm:
    needs: verify
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # provenance now; OIDC trusted publishing later
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - name: Publish (or dry run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --dry-run --access public
          else
            # With npm trusted publishing configured for this workflow, no token is needed (OIDC).
            npm publish --provenance --access public
          fi

  pack:
    # ClawHub's server-side build from source runs out of memory on this repo
    # (pinned openclaw devDependency); hand it the prebuilt package instead.
    needs: verify
    if: ${{ inputs.publish_clawhub }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tgz: ${{ steps.pack.outputs.tgz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - id: pack
        run: |
          npm pack --silent > pack.txt
          echo "tgz=$(tail -1 pack.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: clawphylax-pack
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error

  clawhub-plugin:
    # Own job instead of ClawHub's reusable workflow: their artifact path does
    # not pass the OIDC env through, and their source path builds server-side
    # and runs out of memory on this repo. The clawhub CLI itself uses GitHub
    # Actions OIDC automatically when ACTIONS_ID_TOKEN_REQUEST_* are present.
    needs: [verify, pack]
    if: ${{ inputs.publish_clawhub }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: clawphylax-pack
          path: pack
      - run: npm install -g clawhub@latest
      - name: Publish prebuilt package to ClawHub (OIDC trusted publishing)
        env:
          TGZ: ${{ needs.pack.outputs.tgz }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          ARGS=(package publish "$PWD/pack/$TGZ" --source-repo aeneassoft/clawphylax --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF" --topics agent-diagnostics,verification,messaging,skill-safety,security --changelog "$CHANGELOG" --json)
          if [[ "$DRY_RUN" == "true" ]]; then ARGS+=(--dry-run); fi
          clawhub "${ARGS[@]}"

  clawhub-skill:
    needs: verify
    if: ${{ inputs.publish_skills }}
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      root: skill
      dry_run: ${{ inputs.dry_run }}
      changelog: ${{ inputs.changelog }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
