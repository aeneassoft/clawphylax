name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save openclaw@2026.6.1
      - run: npx tsc -p tsconfig.json
      - run: npx vitest run
      - run: npm pack --dry-run
